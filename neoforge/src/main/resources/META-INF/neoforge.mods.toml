modLoader = "javafml"
loaderVersion = "[1,)"
license = 'https://github.com/${repository}/blob/1.20.x/LICENSE.txt'
issueTrackerURL = "https://github.com/${repository}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''cosmetic hats for supporters of team galena'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    versionRange = "[21,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"